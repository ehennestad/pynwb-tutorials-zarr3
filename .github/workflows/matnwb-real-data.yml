name: MatNWB reads a real dataset converted to Zarr v3

# The content check of matnwb-content.yml, run on real data instead of tutorial
# output: real NWB files from DANDI (listed in scripts/convert_real_datasets.py) are
# converted from HDF5 to Zarr v3 with hdmf-zarr, and MatNWB's reading of each store is
# compared with PyNWB's. The data is gigabytes, so this runs weekly and on demand
# rather than on every pull request. Checks that MatNWB cannot pass yet are listed,
# with reasons, in ci/matnwb_real_data_known_failures.txt.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"  # Mondays, 07:00 UTC, after the tutorial workflows

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MATNWB_REF: zarr-support/5-zarr3-reader
  MATLAB_RELEASE: R2025b

jobs:
  check-real-data:
    name: Convert real data with hdmf-zarr, compare MatNWB's reading
    runs-on: ubuntu-latest

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out MatNWB (Zarr v3 reader branch)
        uses: actions/checkout@v4
        with:
          repository: NeurodataWithoutBorders/matnwb
          ref: ${{ env.MATNWB_REF }}
          path: matnwb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # hdmf-zarr 0.14.0 requires Python 3.12 or newer.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the tutorial environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Report resolved versions
        run: python -m pip list | grep -Ei "^(pynwb|hdmf|hdmf[-_]zarr|zarr|numcodecs|numpy) "

      - name: Restore the downloaded HDF5 files
        # The DANDI assets are pinned and verified by SHA-256, so a cached copy is the
        # same file; the cache only saves the download. The conversion is not cached,
        # because it depends on the hdmf-zarr release being tested.
        uses: actions/cache@v4
        with:
          path: real-data-cache
          key: real-data-${{ hashFiles('scripts/convert_real_datasets.py') }}

      - name: Convert the real datasets to Zarr v3
        run: python scripts/convert_real_datasets.py --cache real-data-cache --output real-stores

      - name: Record what PyNWB reads from each store
        run: python scripts/write_read_manifests.py real-stores --output real-manifests

      - name: Install the codec libraries zarr-matlab links against
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev libblosc-dev

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ env.MATLAB_RELEASE }}
          cache: true

      - name: Install MatBox
        uses: ehennestad/matbox-actions/install-matbox@v1

      - name: Compare MatNWB's reading with the manifests
        uses: matlab-actions/run-command@v3
        with:
          command: |
            addpath(genpath("matnwb"));
            matbox.installRequirements("matnwb", SaveSearchPath=false, AgreeToLicenses=true);
            zarrRoot = fileparts(fileparts(which("zarr.open")));
            addpath(fullfile(zarrRoot, "tools"));
            build_mex();
            addpath("scripts");
            verifyStoreContents("real-stores", ManifestDirectory="real-manifests", ...
                KnownFailureFile="ci/matnwb_real_data_known_failures.txt", ...
                JUnitFile="results/real-data-checks.xml");

      - name: Upload the check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-data-check-report
          path: |
            results/
            real-manifests/
          retention-days: 14
