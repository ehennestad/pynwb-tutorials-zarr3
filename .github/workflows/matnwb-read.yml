name: MatNWB reads the Zarr v3 stores

# Cross-backend compatibility probe: write NWB Zarr v3 stores with PyNWB (via the
# hdmf-zarr zarr-v3-migration branch), then open every one of them with MatNWB's
# Zarr v3 reader. Stores that MatNWB cannot yet read are listed, with reasons, in
# ci/matnwb_known_failures.txt.
#
# Both sides track moving branches, so this also runs weekly to catch breakage that
# lands upstream rather than here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Mondays, 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MATNWB_REF: zarr-support/5-zarr3-reader
  MATLAB_RELEASE: R2025b

jobs:
  read-stores:
    name: Write with PyNWB, read with MatNWB
    runs-on: ubuntu-latest

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out MatNWB (Zarr v3 reader branch)
        uses: actions/checkout@v4
        with:
          repository: NeurodataWithoutBorders/matnwb
          ref: ${{ env.MATNWB_REF }}
          path: matnwb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the tutorial environment
        # Pulls hdmf-zarr from its zarr-v3-migration branch; see pyproject.toml.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Report resolved versions
        run: python -m pip list | grep -Ei "^(pynwb|hdmf|hdmf-zarr|zarr|numcodecs|numpy) "

      - name: Write the Zarr v3 stores
        # Also asserts that every store declares zarr_format 3 before MatNWB sees it.
        run: python scripts/run_zarr_v3_tutorials.py --keep-output stores

      - name: Install the codec libraries zarr-matlab links against
        # zarr-matlab decompresses chunks through a MEX extension that has to be built
        # against libzstd and libblosc. Zarr v3 compresses with Zstd by default, so
        # without this every store fails to read with zarr:MissingMex.
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev libblosc-dev

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ env.MATLAB_RELEASE }}
          # Installing MATLAB is by far the slowest step; the cache is keyed on the
          # release, so it only re-downloads when MATLAB_RELEASE changes.
          cache: true

      - name: Install MatBox
        uses: ehennestad/matbox-actions/install-matbox@v1

      - name: Read every store with nwbRead
        uses: matlab-actions/run-command@v3
        with:
          # One MATLAB session: installRequirements pulls zarr-matlab and
          # hdmf-zarr-matlab (listed in matnwb/requirements.txt) and adds them to the
          # in-session path, so there is no need to persist it with savepath.
          # zarr-matlab ships its MEX codecs unbuilt, so build them before reading.
          #
          # These clones are deliberately not cached. They track moving branches, and
          # this workflow exists to notice when upstream changes break the round-trip --
          # a cached clone would hide exactly what it is meant to catch.
          command: |
            addpath(genpath("matnwb"));
            matbox.installRequirements("matnwb", SaveSearchPath=false, AgreeToLicenses=true);
            zarrRoot = fileparts(fileparts(which("zarr.open")));
            fprintf("Building zarr-matlab MEX codecs in %s\n", zarrRoot);
            addpath(fullfile(zarrRoot, "tools"));
            build_mex();
            addpath("scripts");
            verifyStoresReadable("stores", KnownFailureFile="ci/matnwb_known_failures.txt");

      - name: Upload the stores when the read check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zarr-v3-stores
          path: stores/
          retention-days: 7
