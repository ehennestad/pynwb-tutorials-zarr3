[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynwb-tutorials-zarr3"
version = "0.1.0"
description = "PyNWB gallery tutorials rewritten to read and write Zarr v3 backed NWB files"
readme = "README.md"
requires-python = ">=3.12"  # hdmf-zarr 0.14.0 requires Python 3.12 or newer
license = {text = "BSD-3-Clause"}

# The tutorials are run as standalone scripts; this project exists only to pin the
# environment they need. Zarr format 3 output requires hdmf-zarr 0.14.0, which is
# merged on the dev branch (hdmf-dev/hdmf-zarr#325) but not yet published: the latest
# PyPI release (0.13.0) pins zarr<3.0. Replace the git reference with
# "hdmf-zarr>=0.14.0" once 0.14.0 is on PyPI.
dependencies = [
    "pynwb>=4.2.0",
    "hdmf-zarr @ git+https://github.com/hdmf-dev/hdmf-zarr.git@dev",
    "zarr>=3.4.0",
    "numcodecs>=0.14.0",
    "numpy>=2.0.0",
    "pandas>=1.4.0",
    "python-dateutil>=2.8.2",
    "matplotlib>=3.6",
    "Pillow>=10.0.0",
]

[tool.hatch.metadata]
# required to resolve the direct git reference for hdmf-zarr
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# metadata-only project: there is no importable package to select
bypass-selection = true
