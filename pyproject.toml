[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynwb-tutorials-zarr3"
version = "0.1.0"
description = "PyNWB gallery tutorials rewritten to read and write Zarr v3 backed NWB files"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}

# The tutorials are run as standalone scripts; this project exists only to pin the
# environment they need. Zarr format 3 output requires the unreleased hdmf-zarr
# migration branch -- no published hdmf-zarr release supports zarr-python 3.
dependencies = [
    "pynwb>=4.1.0",
    "hdmf-zarr @ git+https://github.com/hdmf-dev/hdmf-zarr.git@zarr-v3-migration",
    "zarr>=3.1.3",
    "numcodecs>=0.14.0",
    "numpy>=1.24.0",
    "pandas>=1.4.0",
    "python-dateutil>=2.8.2",
    "matplotlib>=3.6",
    "Pillow>=10.0.0",
]

[tool.hatch.metadata]
# required to resolve the direct git reference for hdmf-zarr
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# metadata-only project: there is no importable package to select
bypass-selection = true
